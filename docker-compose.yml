# One site = one container + one data volume.  Copy .env.example to .env, set the values, then:
#   docker compose up -d --build
# For several customers: one folder (or compose project name) per customer, each with its own .env and port.
services:
  site:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:10000"
    environment:
      # blank = empty site + setup assistant | demo = sample content | content = import CONTENT_FILE
      Seed__Mode: ${SEED_MODE:-blank}
      Seed__Preset: ${SEED_PRESET:-services}
      Seed__ContentFile: ${CONTENT_FILE:-}
      # content mode only: publish immediately and skip the assistant (ready-made demo)
      Seed__Publish: ${SEED_PUBLISH:-false}
      # The customer enters this key on /setup to become the admin (min. 8 characters).
      Setup__Key: ${SETUP_KEY:?set SETUP_KEY in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (min. 32 characters)}
      Otp__HashKey: ${OTP_HASH_KEY:?set OTP_HASH_KEY (min. 32 characters)}
      # Optional real SMS (otherwise admins sign in with the setup key on /setup)
      Sms__Provider: ${SMS_PROVIDER:-Console}
      Sms__ApiKey: ${SMS_API_KEY:-}
      Demo__OpenAccess: ${DEMO_OPEN_ACCESS:-false}
      Seed__AdminPhone: ${ADMIN_PHONE:-}
    volumes:
      - site-data:/app/data
      # - ./content.json:/app/content/content.json:ro   # for SEED_MODE=content, with CONTENT_FILE=/app/content/content.json

volumes:
  site-data:
